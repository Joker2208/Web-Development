<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart</title>
     <link rel="stylesheet" href="style.css">


    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #img1{
            height: 200px;
            width: 200px;
        }
    

        .box{
            height: 400px;
            width: 300px;
            margin: auto;
            margin-top: 50px;
            padding: 50px;
            border: 2px solid black;
            border-radius: 50px 50px 50px 50px;
            text-align: center;
            background: linear-gradient(white, yellow ) ;
        }

        .price{
            display: none;
        }

        .p1{
            display: block;
            font-size: 1.5em;
        }

        .p2{
            display: inline-block;
        }
    </style>
</head>
<body>
    
    <div class="box">
        <img src="oats.jpg" alt="" id="img1">
        <p class="p1">Healthy Oats</p><br>
        <p class="p2">Price: <span class="price">Rs.7 Crore</span></p>
    </div><br>


</body>
</html>
