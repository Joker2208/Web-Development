
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Food Item</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4" style="width: 450px;">
            {% if food %}
            <h3 class="text-center mb-4">Update Food Item</h3>
            {%else%}
            <h3 class="text-center mb-4">Add Food Item</h3>
           {% endif %}
            <span class="text-success">{{msg}}</span>
            <form  action = "{% url 'register' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{food.id}}">
                <!-- Food Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Food Name</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           placeholder="Enter food name"
                           value="{{food.name}}"
                           required>
                </div>

                <!-- Quantity -->
                <div class="mb-3">
                    <label for="qty" class="form-label">Quantity</label>
                    <input type="number"
                           class="form-control"
                           id="qty"
                           name="qty"
                           placeholder="Enter quantity"
                           min="1"
                           value="{{food.qty}}"
                           required>
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label for="price" class="form-label">Price</label>
                    <input type="number"
                           class="form-control"
                           id="price"
                           name="price"
                           placeholder="Enter price"
                           min="0"
                           step="0.01"
                           value="{{food.price}}"
                           required>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">

                    <button type="submit" class="btn btn-success" style="margin: 5px;">
                        {% if food %}
                        Update Food Item
                        {% else %}
                        Add Food Item
                        {% endif %}
                    </button>
                    <button type="reset" class="btn btn-secondary" style="margin: 5px;">Clear</button>
                    <a href="{% url 'display' %}" class="btn btn-danger" style="margin: 5px;">View List</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
