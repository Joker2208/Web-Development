<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        {%if st%}
                        <h3>Student Update</h3>
                        {%else%}
                        <h3>Student Registration</h3>
                        {%endif%}
                    </div>

                    <div class="card-body">

                        <span class="text-success">{{ msg }}</span>

                        <form action="{% url 'register' %}" method="POST">

                            {% csrf_token %}

                            <input type="hidden" name="id" value="{{ st.id }}">

                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label">Student Name</label>

                                <input type="text"
                                       name="name"
                                       value="{{ st.name }}"
                                       class="form-control"
                                       placeholder="Enter student name"
                                       required>
                            </div>

                            <!-- Course -->
                            <div class="mb-3">
                                <label class="form-label">Course</label>

                                <select name="course" class="form-select" required>

                                    <option value="">Select Course</option>

                                    <option value="Python"
                                        {% if st.course == "Python" %}selected{% endif %}>
                                        Python
                                    </option>

                                    <option value="Django"
                                        {% if st.course == "Django" %}selected{% endif %}>
                                        Django
                                    </option>

                                    <option value="Java"
                                        {% if st.course == "Java" %}selected{% endif %}>
                                        Java
                                    </option>

                                    <option value="Web Development"
                                        {% if st.course == "Web Development" %}selected{% endif %}>
                                        Web Development
                                    </option>

                                </select>
                            </div>

                            <!-- Grade -->
                            <div class="mb-3">
                                <label class="form-label">Grade</label>

                                <select name="grade" class="form-select" required>

                                    <option value="">Select Grade</option>

                                    <option value="A+"
                                        {% if st.grade == "A+" %}selected{% endif %}>
                                        A+
                                    </option>

                                    <option value="A"
                                        {% if st.grade == "A" %}selected{% endif %}>
                                        A
                                    </option>

                                    <option value="B+"
                                        {% if st.grade == "B+" %}selected{% endif %}>
                                        B+
                                    </option>

                                    <option value="B"
                                        {% if st.grade == "B" %}selected{% endif %}>
                                        B
                                    </option>

                                    <option value="C"
                                        {% if st.grade == "C" %}selected{% endif %}>
                                        C
                                    </option>

                                    <option value="D"
                                        {% if st.grade == "D" %}selected{% endif %}>
                                        D
                                    </option>

                                </select>
                            </div>

                            <!-- Buttons -->
                            <div class="d-grid">

                                <button type="submit" class="btn btn-primary mb-3">
                                    {%if st%}
                                    Update Student
                                    {%else%}
                                    Register Student
                                    {%endif%}
                                </button>

                                <a href="{% url 'display' %}"
                                   class="btn btn-danger mb-3">
                                    View Students
                                </a>

                                <button type="reset" class="btn btn-secondary">
                                    Clear
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
