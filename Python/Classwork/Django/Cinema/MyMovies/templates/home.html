<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    {% if movie %}
                    <h3 class="text-center mb-4">Update Movie</h3>
                    {% else %}
                    <h3 class="text-center mb-4">Add Movie</h3>
                    {% endif %}
                    <span class="text-success">{{msg}}</span>

                    <form action="{% url 'register' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" name="id" value="{{movie.id}}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Movie Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter movie name"
                                maxlength="30"
                                value = "{{movie.name}}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="rating" class="form-label fw-semibold">Rating</label>
                            <input
                                type="number"
                                class="form-control"
                                id="rating"
                                name="rating"
                                placeholder="Enter rating (0 to 10)"
                                min="0"
                                max="10"
                                value="{{movie.rating}}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="genre" class="form-label fw-semibold">Genre</label>
                            <input
                                type="text"
                                class="form-control"
                                id="genre"
                                name="genre"
                                placeholder="Enter genre"
                                maxlength="20"
                                value="{{movie.genre}}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="year" class="form-label fw-semibold">Year</label>
                            <input
                                type="number"
                                class="form-control"
                                id="year"
                                name="year"
                                placeholder="Enter release year"
                                min="1900"
                                max="2100"
                                value="{{movie.year}}"
                                required>
                        </div>

                        {% if movie %}
                        <img src="media/{{movie.image}}" alt="" width="50px" height="50px">
                        {%endif%}

                        <div class="mb-3">
                            <input type="file" class="form-control" id="file" name="file">
                        </div>

                        <div class="d-grid gap-2">
                            {% if movie %}
                            <button type="submit" class="btn btn-primary btn-lg">Update Movie</button>
                            {% else %}
                            <button type="submit" class="btn btn-primary btn-lg">Save Movie</button>
                            {% endif %}
                            <button type="reset" class="btn btn-secondary">Clear</button>
                            <a href="{% url 'display' %}" class="btn btn-outline-primary">View All Movies</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
