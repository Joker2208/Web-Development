<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema - Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Cinema</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">All Movies</h2>
            <a href="{% url 'home' %}" class="btn btn-primary">Add Movie</a>
        </div>

        <div class="row g-4">

            {% for m in movies %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <img src="media/{{m.image}}" alt="{{m.image}}" width="100px" height="100px">
                        <h5 class="card-title">{{m.name}}</h5>
                        <p class="card-text mb-1">Genre: {{m.genre}}</p>
                        <p class="card-text mb-1">Rating: {{m.rating}}</p>
                        <p class="card-text">Year: {{m.year}}</p>
                    </div>
                    <div class="card-footer bg-white">
                        <a href="{% url 'update' %}?id={{m.id}}" class="btn btn-sm btn-warning">Update</a>
                        <a href="{% url 'delete' %}?id={{m.id}}" class="btn btn-sm btn-danger">Delete</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="text-muted">No movies added yet.</p>
            {% endfor %}

        </div>
    </div>

</body>
</html>
