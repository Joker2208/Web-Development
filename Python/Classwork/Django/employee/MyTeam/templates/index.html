<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        {% if employee %}
                        <h3>Employee Update</h3>
                        {% else %}
                        <h3>Employee Registration</h3>
                        {% endif %}
                    </div>

                    <div class="card-body">
                        <span class="text-success">{{msg}}</span>
                        <form action="{% url 'register' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name = "id" value="{{employee.id}}" >

                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Enter employee name" value="{{employee.name}}">
                            </div>

                            <!-- Department -->
                            <div class="mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" name="dept" class="form-control" placeholder="Enter department" value="{{employee.dept}}">
                            </div>

                            <!-- Year -->
                            <div class="mb-3">
                                <label class="form-label">Year</label>
                                <input type="number" name="year" class="form-control" placeholder="Enter year" value="{{employee.year}}">
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary mb-3">
                                {% if employee %}
                                Update Employee
                                {% else %}
                                Register Employee
                                {% endif %}
                            </button>
                            <a href="{% url 'display' %}" class="btn btn-danger mb-3">View Employees</a>
                            <button type="reset" class="btn btn-secondary mb-3">Clear</button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
