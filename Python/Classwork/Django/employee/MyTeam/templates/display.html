<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">
                <h3>Employee List</h3>
            </div>

            <div class="card-body">

                <table class="table table-bordered table-hover text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                            {% for emp in employees %}
                        <tr>
                            <td>{{forloop.counter}}</td>
                            <td>{{emp.name}}</td>
                            <td>{{emp.dept}}</td>
                            <td>{{emp.year}}</td>
                            <td>
                                <a href="{% url 'update' %}?id={{emp.id}}" class="btn btn-warning">Update</a>
                                <a href="{% url 'delete' %}?id={{ emp.id }}" class="btn btn-danger">Delete</a>
                            </td>
                        </tr>
                            {%endfor%}

                    </tbody>

                </table>
                <a href="{% url 'index' %}" class="btn btn-success">Back To Registration</a>
            </div>
        </div>

    </div>

</body>
</html>
