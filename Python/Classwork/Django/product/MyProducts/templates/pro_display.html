<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Header & Add Button -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="card-title text-primary fw-bold mb-0">Product Inventory</h3>
                            <a href="{%url 'product'%}" class="btn btn-success">+ Add Product</a>
                        </div>

                        <!-- Product Table -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Product Name</th>
                                        <th scope="col">Quantity </th>
                                        <th scope="col">Price</th>
                                        <th scope="col">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for product in products %}
                                    <tr>
                                       <td>{{product.id}}</td>
                                       <td>{{product.p_name}}</td>
                                       <td>{{product.qty}}</td>
                                       <td>{{product.price}}</td>
                                       <td>
                                           <a href="{%url 'update'%}?id={{product.id}}" class="btn btn-warning btn-sm">Update</a>
                                           <a href="{%url 'delete'%}?id={{product.id}}" class="btn btn-danger btn-sm">Delete</a>
                                       </td>
                                    </tr>
                                    
                                    {%  endfor %}
                                    
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
