<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                {%if pr%}
                <h3 class="mb-0">Update Product</h3>
                {%else%}
                <h3 class="mb--1" style="text-align: center; margin-top: 1px;">Add Product</h3>
                {%endif%}
                <div class="card-body p-4 p-sm-5">
                    <span class="text-success">{{msg}}</span>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        
                    </div>

                    <form action="{% url 'register'%}" method="POST" >
                        {%csrf_token%}
                        <input type="hidden" name="id" value="{{pr.id}}">
                        <div class="mb-3">
                            <label for="p_name" class="form-label fw-semibold">Product Name</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="p_name" 
                                name="p_name" 
                                placeholder="Enter product name" 
                                value="{{pr.p_name}}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="qty" class="form-label fw-semibold">Quantity</label>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="qty" 
                                name="qty" 
                                placeholder="Enter quantity" 
                                min="1" 
                                value="{{pr.qty}}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="price" class="form-label fw-semibold">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="price" 
                                    name="price" 
                                    placeholder="0.00" 
                                    step="0.01" 
                                    min="0" 
                                    value="{{pr.price}}"
                                    required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            {%if pr%}
                            <button type="submit" class="btn btn-primary btn-lg">Update Product</button>
                            {%else%}
                            <button type="submit" class = "btn btn-primary btn-lg">Save Product</button>
                            {%endif%}
                            <button type="reset" class="btn btn-secondary">Clear</button>

                            <a href="{% url 'display' %}" class="btn btn-outline-primary">View All Products</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
