<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 25px 30px;
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
        }

        .table thead th {
            background: #f8f9fa;
            padding: 16px;
            font-size: 14px;
            text-transform: uppercase;
            color: #6c757d;
        }

        .table tbody td {
            padding: 18px 16px;
        }

        .table tbody tr:hover {
            background: #f8fbff;
        }

        .product-name {
            font-weight: 600;
            color: #212529;
        }

        .price {
            font-weight: 600;
            color: #198754;
        }

        .quantity-badge {
            background: #e7f1ff;
            color: #0d6efd;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .action-btn {
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card main-card">

        <div class="page-header">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>
                    <h2 class="fw-bold mb-1">📦 Product Inventory</h2>
                    <p class="mb-0 opacity-75">
                        Manage all your products
                    </p>
                </div>

                <a href="{% url 'index' %}" class="btn btn-light fw-semibold">
                    + Add Product
                </a>

            </div>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table">

                    <thead>
                        <tr>
                            <th>id</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Category</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for pro in products %}
                        <tr>
                            <td>{{forloop.counter}}</td>

                            <td>
                                <span class="product-name">
                                    {{pro.name}}
                                </span>
                            </td>

                            <td>
                                <span class="price">
                                    {{pro.price}}
                                </span>
                            </td>

                            <td>
                                <span class="quantity-badge">
                                    {{pro.qty}}
                                </span>
                            </td>


                            <td>
                                <span class="quantity-badge">
                                    {{pro.category.name}}
                                </span>
                            </td>

                            <td class="text-center">

                                <a href="{%url 'index' %}?id={{pro.id}}" class="btn btn-outline-primary action-btn me-1">
                                    Edit
                                </a>

                                <a href="{%url 'delete' %}?id={{pro.id}}" class="btn btn-outline-danger action-btn">
                                    Delete
                                </a>

                            </td>
                        </tr>
                                {%endfor%}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
