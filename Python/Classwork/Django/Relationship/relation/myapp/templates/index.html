<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e4e9f2);
            min-height: 100vh;
        }

        .product-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .product-icon {
            font-size: 40px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card product-card">

                <div class="card-header-custom text-center">
                    <div class="product-icon">📦</div>
                    {%if product%}
                    <h2 class="fw-bold mb-1">Update Product</h2>
                    <p class="mb-0 opacity-75">
                        Update the product in your inventory
                    </p>
                    {%else%}
                    <h2 class="fw-bold mb-1">Add Product</h2>
                    <p class="mb-0 opacity-75">
                        Add a new product to your inventory
                    </p>
                    {%endif%}

                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="">
                        {%csrf_token%}
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Product Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                placeholder="Enter product name"
                                value="{{product.name}}"
                                required
                            >
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">
                                    Price
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">₹</span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        name="price"
                                        placeholder="0.00"
                                        step="0.01"
                                        value="{{product.price}}"
                                        required
                                    >
                                </div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">
                                    Quantity
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="qty"
                                    placeholder="Enter quantity"
                                    min="1"
                                    value="{{product.qty}}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Select Category</option>
                                    

                                    {%for cat in categories%}
                                    <option value="{{cat.id}}" {%if product.category.id == cat.id %}selected{%endif%}>{{cat.name}}</option>
                                    {%endfor%}
                                </select>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            {%if product%}
                            Update Product
                            {%else%}
                            + Add Product
                            {%endif%}
                        </button>

                        <button type="reset" class="btn btn-light border w-100">
                            Clear Form
                        </button>

                        <a href="{%url 'display' %}" class="btn btn-success w-100 mb-3" style="margin-top: 10px;">Display Products</a>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
