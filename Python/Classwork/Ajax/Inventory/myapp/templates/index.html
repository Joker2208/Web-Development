<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Inventory</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function (){
            display()
        })

        function display(){

            $.get("display",{},function (rt){

                var rows= ""
                rt.data.map(ele => {

                    rows+= `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.price}</td>
                        <td>${ele.qty}</td>
                        <td>${ele.brand}</td>
                        <td><button class='btn btn-danger' onclick='delete_product(${ele.id})'>Delete</button></td>
                    </tr>`
                })

                $("#tdata").html(rows)
            })
        }

        function register(){
            var name = $("#name").val()
            var price = $("#price").val()
            var qty = $("#qty").val()
            var brand = $("#brand").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();
            
            $.post("register", {csrfmiddlewaretoken,name,price,qty,brand},function(rt){
                alert(rt)
            })

            reset()
            display()
        }

        function reset(){
            $("#name").val("")
            $("#price").val("")
            $("#qty").val("")
            $("#brand").val("")
        }
    </script>


</head>
<body class="bg-light py-4">

  <div class="container-fluid px-4">
    <h2 class="mb-4 text-center fw-bold text-primary">Product Inventory Management</h2>

    <!-- Side-by-side row -->
    <div class="row g-4 align-items-start">
      
      <!-- Left Column: Add Product Form -->
      <div class="col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white py-3">
            <h5 class="card-title mb-0 fw-semibold">Add New Product</h5>
          </div>
          <div class="card-body p-4">
          {%csrf_token%}
              <div class="mb-3">
                <label for="productName" class="form-label fw-semibold">Product Name</label>
                <input type="text" class="form-control" placeholder="e.g. Wireless Mouse" id="name" required>
              </div>

              <div class="mb-3">
                <label for="brandName" class="form-label fw-semibold">Brand Name</label>
                <input type="text" class="form-control" placeholder="e.g. Logitech" id="brand" required>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="productQty" class="form-label fw-semibold">Quantity (Qty)</label>
                  <input type="number" class="form-control" min="0" placeholder="0" id="qty" required>
                </div>
                <div class="col-md-6">
                  <label for="productPrice" class="form-label fw-semibold">Price ($)</label>
                  <input type="number" class="form-control" min="0" step="0.01" placeholder="0.00" id="price" required>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button onclick="register()" class="btn btn-primary btn-lg">Add Product</button>
                <button onclick="reset()" class="btn btn-outline-secondary">Clear Form</button>
              </div>
       
          </div>
        </div>
      </div>

      <!-- Right Column: Product Display Table -->
      <div class="col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white py-3">
            <h5 class="card-title mb-0 fw-semibold">Inventory Display</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-light border-bottom">
                  <tr>
                    <th scope="col" class="ps-3">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Brand Name</th>
                    <th scope="col" >Qty</th>
                    <th scope="col" >Price</th>
                    <th colspan="2">Action</th>
                  </tr>
                </thead>
                <tbody id="tdata">
                  
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
