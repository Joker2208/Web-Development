{% extends "catalogue/base.html" %}
{% block title %}Contact | {{ shop_name }}{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:680px">
  <h1 class="section-title">Enquiry</h1>
  <form method="post" novalidate class="bg-white p-4 shadow-sm">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn-gold">Send enquiry</button>
  </form>
</div>
{% endblock %}
