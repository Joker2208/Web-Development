{% extends "inventory/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card shadow-sm login-box">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Sign in</h1>
    {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
